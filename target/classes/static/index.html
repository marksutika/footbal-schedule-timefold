<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Football Scheduler</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b1220; --card:#071129; --card-2:#0f274a; --text:#e6eefc; --muted:#9aa4b2;
      --accent:#4f8cff; --accent-2:#7c3aed; --glass:rgba(255,255,255,0.04);
    }
    body{
      margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:linear-gradient(160deg,#071129 0%, #071a2a 50%, #08182a 100%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .wrap{ max-width:1100px; margin:0 auto; padding:40px 16px; }
    header{ display:flex; align-items:center; gap:16px; margin-bottom:18px }
    h1{ margin:0; font-weight:700; letter-spacing:.2px; font-size:22px }
    .sub{ color:var(--muted); margin-top:4px; }

    .card{
      background:linear-gradient(180deg,var(--card), rgba(10,22,40,0.6));
      border:1px solid rgba(255,255,255,0.04);
      border-radius:14px; padding:18px; box-shadow:0 10px 30px rgba(4,9,20,0.6);
    }

    .controls{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .left{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    label{ color:var(--muted); font-size:13px; }
    select, button{ border-radius:10px; padding:10px 12px; background:transparent; color:var(--text); font-size:14px; border:1px solid rgba(255,255,255,0.03); }
    select{ -webkit-appearance:none; -moz-appearance:none; appearance:none; background: rgba(7,17,36,0.6); color:var(--text); }
    select option{ background-color: rgba(7,17,36,0.98); color:var(--text); }
    select:focus, button:focus{ outline:2px solid rgba(79,140,255,0.12); }
    button{ background:linear-gradient(90deg,var(--accent),var(--accent-2)); border:none; cursor:pointer; font-weight:700; color:white }
    button.secondary{ background:transparent; border:1px solid rgba(255,255,255,0.06); font-weight:600 }
    button:disabled{ opacity:.45; cursor:not-allowed }
    .status{ margin-top:12px; color:var(--muted); }

    table{ width:100%; border-collapse:collapse; margin-top:14px; border-radius:12px; overflow:hidden; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); }
    th,td{ padding:12px 12px; text-align:left; font-size:14px; }
    th{ color:#cfe0ff; font-weight:700; background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-bottom:1px solid rgba(255,255,255,0.03) }
    tr:nth-child(even) td{ background:rgba(255,255,255,0.01) }
    tr:hover td{ background:rgba(79,140,255,0.06) }

    .pill{ display:inline-block; padding:6px 12px; border-radius:999px; background:linear-gradient(90deg,#183b7a,#2b2246); font-weight:600 }
    .footer{ margin-top:18px; color:var(--muted); font-size:13px; text-align:center }
    .footer a{ color:var(--accent) }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Football Scheduler (Timefold)</h1>
    <div class="sub">Generate and optimize a match calendar under hard/soft constraints.</div>

    <div class="card">
      <div class="controls">
        <div class="left">
          <label>
            Dataset:
            <select id="type">
              <option value="small" selected>small (6 teams, 2 cycles)</option>
              <option value="virsliga">virsliga (10 teams, 4 cycles)</option>
              <option value="epl">epl (20 teams, 2 cycles)</option>
            </select>
          </label>

          <label>
            Optimizer:
            <select id="variant">
              <option value="">default</option>
              <option value="tabu">Tabu Search</option>
              <option value="lateAcceptance">Late Acceptance</option>
              <option value="hillClimbing">Hill Climbing</option>
              <option value="simulatedAnnealing">Simulated Annealing</option>
              <option value="constructionHeuristic">Construction Heuristic</option>
            </select>
          </label>

          <button id="solve">Solve</button>

          <button id="download" class="secondary" disabled>Download CSV</button>

          <button id="explainBtn" class="secondary" disabled>Explain</button>

          <label>
            Round:
            <select id="roundFilter" disabled>
              <option value="all">All</option>
            </select>
          </label>

          <button id="lastRound" class="secondary" disabled>Last round</button>
        </div>

        <span class="pill" id="pill">Idle</span>
      </div>

      <div class="status" id="status"></div>

      <table>
        <thead>
          <tr>
            <th>Round</th><th>Date</th><th>Day</th><th>Time</th>
            <th>Home</th><th>Away</th><th>Stadium</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="footer">
      © 2026 Kaspars Grīnbergs‑Zaļkalns & Marks Sutika —
      <a href="https://github.com/marksutika/footbal-schedule-timefold" target="_blank">GitHub</a>
      · <a href="/benchmark.html">Benchmark results</a>
    </div>
  </div>

<script>
let currentId = null;
let lastMatches = [];
let lastRoundNumber = null;

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function computeMatchDate(roundStartDateStr, timeslotDay) {
  const roundStart = new Date(roundStartDateStr + "T00:00:00");
  const jsDowToJava = d => (d === 0 ? 7 : d);
  const startDow = jsDowToJava(roundStart.getDay());
  const targetDow = ({
    MONDAY:1,TUESDAY:2,WEDNESDAY:3,THURSDAY:4,FRIDAY:5,SATURDAY:6,SUNDAY:7
  })[timeslotDay];
  const matchDate = new Date(roundStart);
  matchDate.setDate(matchDate.getDate() + (targetDow - startDow));
  return matchDate.toISOString().slice(0,10);
}

function toCsv(matches){
  const header = ["round","date","day","time","home","away","stadium"];
  const lines = [header.join(",")];
  for(const m of matches){
    const date = computeMatchDate(m.round.startDate, m.timeslot.dayOfWeek);
    const row = [
      m.round.roundNumber,
      date,
      m.timeslot.dayOfWeek,
      m.timeslot.startTime,
      m.homeTeam.name,
      m.awayTeam.name,
      (m.stadium ? m.stadium.name : "")
    ].map(v => `"${String(v).replaceAll('"','""')}"`);
    lines.push(row.join(","));
  }
  return lines.join("\n");
}

function renderTable(matches) {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  for(const m of matches){
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${m.round.roundNumber}</td>
      <td>${m._date}</td>
      <td>${m.timeslot.dayOfWeek}</td>
      <td>${m.timeslot.startTime}</td>
      <td>${m.homeTeam.name}</td>
      <td>${m.awayTeam.name}</td>
      <td>${m.stadium ? m.stadium.name : ""}</td>`;
    tbody.appendChild(tr);
  }
}

function fillRoundFilter(maxRound) {
  lastRoundNumber = maxRound;
  const sel = document.getElementById("roundFilter");
  sel.innerHTML = `<option value="all">All</option>`;
  for (let r = 1; r <= maxRound; r++) {
    const opt = document.createElement("option");
    opt.value = String(r);
    opt.textContent = String(r);
    sel.appendChild(opt);
  }
  sel.disabled = false;
  document.getElementById("lastRound").disabled = false;
}

function applyRoundFilter() {
  const sel = document.getElementById("roundFilter");
  const v = sel.value;
  if (v === "all") {
    renderTable(lastMatches);
    return;
  }
  const rn = Number(v);
  renderTable(lastMatches.filter(m => m.round.roundNumber === rn));
}

document.getElementById("roundFilter").addEventListener("change", applyRoundFilter);

document.getElementById("lastRound").onclick = () => {
  if (!lastRoundNumber) return;
  document.getElementById("roundFilter").value = String(lastRoundNumber);
  applyRoundFilter();
};

document.getElementById("download").onclick = () => {
  const csv = toCsv(lastMatches);
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `schedule_${document.getElementById("type").value}_${currentId}.csv`;
  a.click();
  URL.revokeObjectURL(url);
};

  document.getElementById("explainBtn").onclick = async () => {
  if (!currentId) return;
  const res = await fetch(`/api/schedule/explain/${currentId}`);
  if (res.status === 202) { alert('Solution not ready yet'); return; }
  if (!res.ok) {
    const txt = await res.text();
    alert('Explain failed: ' + txt);
    return;
  }
  const data = await res.json();
  // show simple modal with formatted JSON
  const modal = document.createElement('div');
  modal.style.position='fixed'; modal.style.inset='0'; modal.style.background='rgba(0,0,0,0.6)'; modal.style.display='flex'; modal.style.alignItems='center'; modal.style.justifyContent='center';
  const box = document.createElement('div'); box.style.width='80%'; box.style.maxWidth='900px'; box.style.background='white'; box.style.color='#0b1220'; box.style.padding='18px'; box.style.borderRadius='12px'; box.style.maxHeight='80%'; box.style.overflow='auto';
  const pre = document.createElement('pre'); pre.style.whiteSpace='pre-wrap'; pre.style.wordBreak='break-word'; pre.textContent = JSON.stringify(data, null, 2);
  const close = document.createElement('button'); close.textContent='Close'; close.style.marginTop='12px'; close.onclick = () => document.body.removeChild(modal);
  box.appendChild(pre); box.appendChild(close); modal.appendChild(box); document.body.appendChild(modal);
};

document.getElementById("solve").onclick = async () => {
  const type = document.getElementById("type").value;
    const variant = document.getElementById("variant").value || null;

  // reset UI state
  document.getElementById("download").disabled = true;
  document.getElementById("roundFilter").disabled = true;
  document.getElementById("lastRound").disabled = true;
  document.getElementById("roundFilter").innerHTML = `<option value="all">All</option>`;
  lastMatches = [];
  lastRoundNumber = null;
  document.getElementById("tbody").innerHTML = "";

  const pill = document.getElementById("pill");
  pill.textContent = "Solving...";
  document.getElementById("status").textContent = "Starting solver...";

  const res = await fetch("/api/schedule/solve", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({type, variant})
  });
  const data = await res.json();
  currentId = data.scheduleId;

  while(true){
    const st = await (await fetch(`/api/schedule/status/${currentId}`)).json();
    pill.textContent = st.status;

    document.getElementById("status").textContent =
      `ID ${currentId}: ${st.status}` +
      (st.score ? ` | score: ${st.score}` : "") +
      (st.variant ? ` | variant: ${st.variant}` : (variant ? ` | variant: ${variant}` : '')) +
      (st.valid !== undefined ? ` | valid: ${st.valid}` : "");

    if(st.status === "FAILED"){
      return;
    }
    if(st.status === "SOLVED") break;
    await sleep(500);
  }

  const matches = await (await fetch(`/api/schedule/result/${currentId}`)).json();
  const planned = matches.filter(m => m.round && m.timeslot);

  planned.forEach(m => m._date = computeMatchDate(m.round.startDate, m.timeslot.dayOfWeek));
  planned.sort((a,b) =>
    (a.round.roundNumber - b.round.roundNumber) ||
    a._date.localeCompare(b._date) ||
    String(a.timeslot.startTime).localeCompare(String(b.timeslot.startTime))
  );

  lastMatches = planned;

  // stats
  const dayCounts = {};
  let midweekCount = 0;
  for (const m of planned) {
    const d = m.timeslot.dayOfWeek;
    dayCounts[d] = (dayCounts[d] || 0) + 1;
    if (d === "TUESDAY" || d === "WEDNESDAY") midweekCount++;
  }
  const dayText = Object.entries(dayCounts).map(([d,c]) => `${d}:${c}`).join(" | ");
  document.getElementById("status").textContent +=
    ` | matches: ${planned.length} | midweek: ${midweekCount} | ${dayText}`;

  document.getElementById("download").disabled = (planned.length === 0);
  document.getElementById("explainBtn").disabled = (planned.length === 0);

  // round filter
  const maxRound = planned.reduce((mx, m) => Math.max(mx, m.round.roundNumber), 0);
  if (maxRound > 0) {
    fillRoundFilter(maxRound);
    document.getElementById("roundFilter").value = "all";
  }

  // render (initially all)
  renderTable(planned);
};
</script>
</body>
</html>
